<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GarageOS si è spostato</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lucsor.github.io/garageos-v2/">
<!-- Fallback senza JavaScript -->
<meta http-equiv="refresh" content="2; url=https://lucsor.github.io/garageos-v2/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background: linear-gradient(180deg, #0c333d 0%, #11565f 52%, #189183 100%); color: #14333c; padding: 20px; box-sizing: border-box; }
  main { background: #fff; border-radius: 24px; padding: 32px 28px; max-width: 420px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.3); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #4a5f66; margin: 10px 0; }
  a.btn { display: inline-block; margin-top: 14px; background: #21b57e; color: #fff; text-decoration: none;
          padding: 13px 26px; border-radius: 100px; font-weight: 700; }
  small { display: block; margin-top: 18px; color: #6b7f86; font-size: 12.5px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>🚗 GarageOS si è spostato</h1>
  <p>La nuova versione è su <b>lucsor.github.io/garageos-v2</b>.<br>I tuoi veicoli sono già lì: accedi con lo stesso account Google.</p>
  <a class="btn" href="https://lucsor.github.io/garageos-v2/">Apri GarageOS</a>
  <small>Se avevi l'app sulla schermata Home, aprila dal nuovo indirizzo e aggiungila di nuovo alla Home; poi puoi eliminare la vecchia icona.</small>
</main>
<script>
  // Disattiva SOLO il vecchio service worker della v1 (scope /garageOS/) e le SOLE cache v1.
  // Attenzione: v1 e v2 condividono l'origine lucsor.github.io → mai toccare registrazioni/cache della v2.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r => new URL(r.scope).pathname === '/garageOS/').map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => /^garageos-v1\./.test(k)).map(k => caches.delete(k)));
      }
    } catch (e) { /* il redirect avviene comunque */ }
    location.replace('https://lucsor.github.io/garageos-v2/');
  })();
</script>
</body>
</html>
